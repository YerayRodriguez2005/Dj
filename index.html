<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto DJ - 100% Automático</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff00;
        }

        .track-display {
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .track-display h2 {
            color: #00ff00;
            margin-bottom: 10px;
        }

        .track-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .track-info div {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-left: 3px solid #00ff00;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: #00ff00;
            color: #0a0a0a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            font-family: inherit;
            transition: all 0.3s;
        }

        button:hover {
            background: #00cc00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-container::-webkit-scrollbar {
            width: 8px;
        }

        .log-container::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }

        .log-entry {
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .log-time {
            color: #666;
            margin-right: 10px;
        }

        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 12px;
        }

        .status.playing {
            background: #00ff00;
            color: #0a0a0a;
        }

        .status.queued {
            background: #ffaa00;
            color: #0a0a0a;
        }

        .status.stopped {
            background: #ff0000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎧 AUTO DJ INTELIGENTE</h1>

        <div class="track-display">
            <h2>🎵 Reproduciendo Ahora</h2>
            <div id="current-track">
                <p style="text-align: center; opacity: 0.6;">Sistema listo - Presiona "Iniciar DJ Automático"</p>
            </div>
        </div>

        <div class="controls">
            <button id="btn-start" onclick="startDJ()">▶️ Iniciar DJ Automático</button>
            <button id="btn-stop" onclick="stopDJ()" disabled>⏹️ Detener</button>
        </div>

        <div class="log-container" id="log"></div>
    </div>

    <!-- Cargar módulos EN ORDEN -->
    <script src="MetadataLoader.js"></script>
    <script src="TransitionCalculator.js"></script>
    <script src="AudioPlayer.js"></script>
    <script src="TrackSelector.js"></script>
    <script src="FileScanner.js"></script>
    <script src="MixController.js"></script>

    <script>
        // Sistema de logging visual
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${timestamp}]</span>${message}`;
            
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Actualizar display de canción actual
        function updateTrackDisplay(trackId, metadata, status = 'playing') {
            const display = document.getElementById('current-track');
            
            const statusClass = status === 'playing' ? 'playing' : 
                               status === 'queued' ? 'queued' : 'stopped';
            
            display.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <strong style="font-size: 1.2em;">${trackId}</strong>
                    <span class="status ${statusClass}">${status.toUpperCase()}</span>
                </div>
                <div class="track-info">
                    <div><strong>BPM:</strong> ${metadata.bpm}</div>
                    <div><strong>Energy:</strong> ${metadata.energy}/3</div>
                    <div><strong>Vocals:</strong> ${metadata.vocals}</div>
                    <div><strong>Mix In:</strong> ${metadata.mix_in}s</div>
                    <div><strong>Mix Out:</strong> ${metadata.mix_out}s</div>
                </div>
            `;
        }

        // Instancia global del DJ
        let dj = null;

        // ★ INICIAR SISTEMA 100% AUTOMÁTICO ★
        async function startDJ() {
            log('=== INICIANDO SISTEMA DE DJ AUTOMÁTICO ===');
            
            // Deshabilitar botón
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            
            try {
                dj = new MixController();
                
                // Override de console.log para capturar en UI
                const originalLog = console.log;
                console.log = function(...args) {
                    log(args.join(' '));
                    originalLog.apply(console, args);
                };
                
                // ★ CARGA AUTOMÁTICA ★
                // Solo especifica las carpetas, el resto es automático
                await dj.autoLoadLibrary('musica/canciones', 'musica/json');
                
                // Configurar contexto (opcional)
                const context = {
                    energyDirection: 'neutral',
                    timeOfDay: new Date().getHours() < 18 ? 'day' : 'night'
                };
                
                // ★ INICIAR MODO AUTOMÁTICO ★
                dj.startAutoMode(context);
                
                log('✅ Sistema iniciado - La IA está al mando');
                
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                console.error(error);
                
                document.getElementById('btn-start').disabled = false;
                document.getElementById('btn-stop').disabled = true;
            }
        }

        // Detener sistema
        function stopDJ() {
            if (dj) {
                dj.stop();
                log('⏹️ Sistema detenido por el usuario');
                
                document.getElementById('btn-start').disabled = false;
                document.getElementById('btn-stop').disabled = true;
                
                document.getElementById('current-track').innerHTML = 
                    '<p style="text-align: center; opacity: 0.6;">Sistema detenido</p>';
            }
        }
    </script>
</body>
</html>
